// 경로: build.gradle (프로젝트 루트)
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// ──────────────────────────────────────────────
// 기본 정보
// ──────────────────────────────────────────────
version     = '1.20.1-1.0.0'
group       = 'com.akashiro'
archivesBaseName = 'tails'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// ──────────────────────────────────────────────
// Minecraft / Forge 버전
// ──────────────────────────────────────────────
minecraft {
    mappings channel: 'official', version: '1.20.1'

    // AccessTransformer가 필요하면 아래 주석 해제
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tails {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tails {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'tails',
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
            mods {
                tails {
                    source sourceSets.main
                }
            }
        }
    }
}

// ──────────────────────────────────────────────
// 의존성
// ──────────────────────────────────────────────
repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'

    // Gson — Forge가 이미 포함하고 있지만 명시
    // implementation 'com.google.code.gson:gson:2.10.1'

    // Guava (ArrayListMultimap) — Forge 포함
    // implementation 'com.google.guava:guava:32.1.2-jre'
}

// ──────────────────────────────────────────────
// 빌드 설정
// ──────────────────────────────────────────────
jar {
    manifest {
        attributes([
                'Specification-Title'     : 'tails',
                'Specification-Vendor'    : 'Akashiro',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Akashiro',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// sources jar 생성
java {
    withSourcesJar()
}

// ──────────────────────────────────────────────
// 인코딩
// ──────────────────────────────────────────────
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}